<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>许德杰｜产品体验 · 设计管理 · AI 产品工程</title>
    <style>
      :root { background: #f7f8fa; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f7f8fa; }
      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        padding: clamp(24px, 3.2vw, 48px);
        background: #050505;
        color: #fff;
        transform: translateY(0) skewY(0);
        transform-origin: top center;
        transition: transform 1s cubic-bezier(.87, 0, .13, 1);
        will-change: transform;
      }
      .boot-shell.is-ready {
        transform: translateY(-110%) skewY(-6deg);
        pointer-events: none;
      }
      .boot-loader-wrap {
        width: 100%;
      }
      .boot-count {
        color: #fff;
        font: 700 clamp(84px, 15vw, 240px)/.78 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        letter-spacing: -.085em;
        transform: translateX(-.07em);
        font-variant-numeric: tabular-nums;
      }
      .boot-progress {
        position: relative;
        width: 100%;
        height: 2px;
        margin-top: clamp(16px, 1.5vw, 24px);
        overflow: hidden;
        background: rgba(255, 255, 255, .12);
      }
      .boot-progress-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #fff;
        transform-origin: left center;
        will-change: width;
      }
      .boot-message {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .boot-shell.has-error .boot-message {
        position: static;
        width: auto;
        height: auto;
        margin: 0 0 24px;
        clip: auto;
        overflow: visible;
        color: rgba(255, 255, 255, .72);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-shell { transition-duration: 160ms; transform: none; }
        .boot-shell.is-ready { transform: translateY(-105%); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Dn7_uJZ-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CD7xAGNA.css">
  </head>
  <body>
    <div id="boot-loader" class="boot-shell" role="status" aria-live="polite">
      <div class="boot-loader-wrap">
        <span class="boot-message" data-boot-message>正在加载作品集</span>
        <div class="boot-count" data-boot-count aria-hidden="true">00</div>
        <div class="boot-progress" aria-hidden="true">
          <div class="boot-progress-bar" data-boot-progress></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>请启用 JavaScript 查看许德杰的个人作品集。</noscript>
  </body>
